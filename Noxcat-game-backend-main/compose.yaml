services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: noxcat
      POSTGRES_USER: noxcat
      POSTGRES_PASSWORD: noxcat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxcat -d noxcat"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
